<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>Student Registration Form</h1>
        <form id="registrationForm" onsubmit="return validateForm()">
            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <br><br>
            <label>Enrollment Number:</label>
            <input type="text" id="enrollment"placeholder="Example: 25DCE001">                   
            <br><br>
            <label>Email ID:</label>
            <input type="email" id="email"placeholder="example@charusat.edu.in">                  
            <br><br>
            <label>Mobile Number:</label>
            <input type="tel" id="mobile"placeholder="Enter 10 digit mobile number">                 
            <br><br>
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
            <br><br>
            <label>Confirm Password:</label>
            <input type="password" id="confirmPassword"placeholder="Re-enter password">                  
            <br><br>
            <label>Course:</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="DCE"> Computer Engineering</option>
                <option value="IT"> Information Technology </option>              
                <option value="CE"> Computer Science</option>              
                <option value="EC">Electronics Engineering </option>              
            </select>
            <br><br>
            <label>Year:</label>
            <select id="year">
                <option value="">Select Year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <br><br>
            <label>Gender:</label>
            <div class="gender">
                <input type="radio"name="gender" value="Male">
                <label>Male</label>
                <input type="radio"name="gender"value="Female">
                <label>Female</label>
                <input type="radio"name="gender" value="Other">
                <label>Other</label>
            </div>
            <br>
            <div class="terms">
                <input type="checkbox" id="terms">
                <label>agree to the Terms and Conditions
                </label>
            </div>
            <br>
            <button type="submit">Register </button>
            <button type="reset">Reset</button>
        </form>
    </div>
        <script src="script.js"></script>
</body>
</html>
