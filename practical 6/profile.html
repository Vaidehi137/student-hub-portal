<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js"></script>

    <title>Student Profile</title>

</head>

<body>

<center>

    <br>

    <img src="../images/student hub.png" width="220" alt="Student Hub Logo">

    <h1>STUDENT PROFILE</h1>

    <hr width="80%">

    <!-- Navigation -->

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>

            <th><a href="../index.html">Home</a></th>

            <th><a href="dashboard.html">Dashboard</a></th>

            <th><a href="courses.html">Courses</a></th>

            <th><a href="attendance.html">Attendance</a></th>

            <th><a href="assignments.html">Assignments</a></th>

            <th><a href="results.html">Results</a></th>

            <th><a href="notice.html">Notice</a></th>

            <th><a href="contact.html">Contact</a></th>

            <th><a href="login.html">Logout</a></th>

        </tr>

    </table>

    <br>


    <fieldset style="width:900px;">

        <h2>Student Information</h2>

        <br>


        <!-- Search -->

        <input type="text"
               id="searchInput"
               placeholder="Search Student"
               onkeyup="searchStudent()">

        <br><br>


        <!-- Filter -->

        <select id="courseFilter" onchange="filterStudent()">

            <option value="all">All Courses</option>

            <option value="Computer Engineering">
                Computer Engineering
            </option>

        </select>

        <br><br>


        <!-- Sort -->

        <input type="button"
               value="Sort by Name"
               onclick="sortStudents()">

        <br><br>


        <!-- JSON Data will appear here -->

        <div id="studentData"></div>

        <br>

        <!-- Pagination -->

        <div id="pagination"></div>

        <br>


        <input type="button" value="Edit Profile">

        &nbsp;&nbsp;

        <input type="button" value="Download ID Card">


    </fieldset>


    <br>

    <hr width="80%">

    <footer>

        <p><b>© 2026 Student Hub Portal</b></p>

        <a href="contact.html">Contact</a> |

        <a href="#">Privacy Policy</a> |

        <a href="#">Help</a>

    </footer>

</center>

</body>

</html>
